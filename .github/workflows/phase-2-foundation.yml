name: Phase 4 stable workbook projections

on:
  push:
    branches: [main, phase-3c-overlay-delivery, phase-4-state-projections]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Apps Script syntax
        run: node -e "new Function(require('fs').readFileSync('apps-script/Code.gs', 'utf8'))"
      - name: Run Phase 1 checks
        run: node tests/phase-1-foundation.test.js
      - name: Run Phase 2 checks
        run: node tests/phase-2-foundation.test.js
      - name: Run Phase 3A checks
        run: node tests/phase-3-narrative-runtime.test.js
      - name: Run Phase 3B checks
        run: node tests/phase-3b-resolution-runtime.test.js
      - name: Run Phase 3C checks
        run: node tests/phase-3c-overlay-delivery.test.js
      - name: Run Phase 4 checks
        run: node tests/phase-4-state-projections.test.js
